<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flash Card Loop</title>

    <link rel="icon" href="./app/favicon_io/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="./app/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./app/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./app/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./app/favicon_io/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./app/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="./app/favicon_io/site.webmanifest">

    <link href="./app/index.css" rel="stylesheet" />
    <link href="./app/bootstrap/bootstrap.min.css" rel="stylesheet">
    <script src="./app/bootstrap/bootstrap.bundle.min.js"></script>

    <script src="./app/jquery/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="./app/jquery-ui-1.14.2/jquery-ui.css">
    <script src="./app/jquery-ui-1.14.2/jquery-ui.min.js"></script>
</head>
<body>

<div class="top-banner"></div>

<div class="container">

    <div class="mb-3">
        <label id="jsonFileLabel" class="form-label">Choose Flash Card JSON File:</label>
        <input type="file" id="jsonFile" class="form-control" accept=".json">
    </div>

    <div class="mb-4">
        <button id="flashBtn" class="btn btn-primary me-2">Flash Card</button>
        <button id="defBtn" class="btn btn-warning me-2">Definition</button>
        <button id="nextBtn" class="btn btn-success me-2">Next</button>
        <button id="loadBtn" class="btn btn-secondary">Load All Cards</button>
    </div>

    <div class="mode-section">
	    <div id="idBox" class="border p-3"></div>
        <div id="termBox" class="border p-3"></div>
        <div id="definitionBox" class="border p-3"></div>
    </div>

    <div id="cardList" class="mt-4"></div>
</div>

<script src="./app/app.js"></script>

</body>
</html>
